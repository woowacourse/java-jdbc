plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.5'
    id 'io.spring.dependency-management' version '1.1.5'
}

group = 'com.techcourse'
version = '1.0-SNAPSHOT'
ext['testcontainers.version'] = '1.21.4' // 추가

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    implementation 'com.h2database:h2:2.3.232'
    implementation 'org.testcontainers:mysql'

    implementation 'org.reflections:reflections:0.10.2'
    implementation 'ch.qos.logback:logback-classic:1.5.18'
    implementation 'org.apache.commons:commons-lang3:3.18.0'
    implementation 'org.apache.commons:commons-compress:1.26.2'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'com.mysql:mysql-connector-j:9.1.0'
}

test {
    maxParallelForks = 3
    useJUnitPlatform()

    // Colima 사용 시 Testcontainers가 docker 소켓을 찾을 수 있도록 설정
    def colimaSocket = file("${System.getProperty('user.home')}/.colima/default/docker.sock")
    if (colimaSocket.exists() && !System.getenv('DOCKER_HOST')) {
        environment 'DOCKER_HOST', "unix://${colimaSocket}"
        environment 'TESTCONTAINERS_DOCKER_SOCKET_OVERRIDE', '/var/run/docker.sock'
    }
}
